<!-- Firebase SDK CDN (Modular v10) 추가 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. 본인의 파이어베이스 콘솔 설정값으로 교체
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        projectId: "YOUR_PROJECT_ID",
        // ...기타 설정
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 전역 scope에 바인딩하여 기존 로직과 연결
    window.db = db;
    window.dbOps = { getDocs, collection, doc, setDoc, deleteDoc };
    
    // 초기 로드 시 파이어베이스 데이터 동기화 트리거
    window.initCloudSync();
</script>
